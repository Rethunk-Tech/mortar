# canon go-golangci-lint-00001
version: "2"

linters:
  # canon go-golangci-lint-00002
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - dogsled
    - durationcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gosec
    - interfacebloat
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - zerologlint
  # Mortar only. It launches Steam, the SMAPI installer, a Wine prefix's own taskkill, the OS file manager, gsettings, xdg-mime, the nxm handler it replaced and itself (for the browser extension's links), so a subprocess
  # named by a variable is the product (the updater e2e test runs go and wails3 the same way, and the performance budget restarts its own test binary); gosec has no per-call option for that.
  exclusions:
    rules:
      - path: ^(datadir_recover_other|internal/(avscan/command|launch/launch|launch/term_unix|loader/smapi/install|datadir/open|datadir/copy_windows_test|backdrop/desktop|nxm/handler_linux|nxm/handler_windows|steam/steam|sandbox/sandbox|nativehost/spawn|datasvc/restart|updatesvc/e2e_test|problems/perf_test))\.go$
        linters: [gosec]
        text: G204
      # AMSI is a COM-style DLL whose calls take pointers to Go values, and Windows has no safer way to pass them.
      - path: ^internal/avscan/amsi_windows\.go$
        linters: [gosec]
        text: G103
      # A crafted 7z panics the reader, and an unrecovered panic exits Mortar; outside the archive package every open
      # goes through archive.OpenSevenZip, which recovers it into ErrMalformed.
      - path: ^internal/archive/
        linters: [forbidigo]
  settings:
    forbidigo:
      forbid:
        - pattern: ^sevenzip\.(NewReader|OpenReader)(WithPassword)?$
          msg: use archive.OpenSevenZip, which turns a reader panic into ErrMalformed
    # canon go-golangci-lint-00008
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    # canon go-golangci-lint-00010
    exhaustive:
      check:
        - map
        - switch
    # canon go-golangci-lint-00013
    ireturn:
      allow:
        - anon
        - empty
        - error
        - generic
        - stdlib
        - github.com/Rethunk-Tech/mortar/internal/game.Game
        - github.com/Rethunk-Tech/mortar/internal/host.Host
        - github.com/Rethunk-Tech/mortar/internal/loader.Loader
        - github.com/Rethunk-Tech/mortar/internal/installer.Installer
        - github.com/Rethunk-Tech/mortar/internal/deploy.Deployer
    # canon go-golangci-lint-00011
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/wailsapp/wails/v3
    # canon go-golangci-lint-00009
    gocritic:
      disabled-tags:
        - experimental
        - opinionated
        - performance
        - style
    # canon go-golangci-lint-00004
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # canon go-golangci-lint-00005
    staticcheck:
      checks: ["all"]
    # canon go-golangci-lint-00006
    nolintlint:
      require-explanation: true
      require-specific: true

# canon go-golangci-lint-00003
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# canon go-golangci-lint-00007
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    # canon go-golangci-lint-00012
    gofumpt:
      extra:
        group-params: true
