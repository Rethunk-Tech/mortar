# canon go-golangci-lint-00001
version: "2"

linters:
  # canon go-golangci-lint-00002
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - dogsled
    - durationcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gosec
    - interfacebloat
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - zerologlint
  # Mortar only. It launches Steam, the SMAPI installer, the OS file manager, gsettings, xdg-mime, the nxm handler it replaced and itself (for the browser extension's links), so a subprocess
  # named by a variable is the product; gosec has no per-call option for that.
  exclusions:
    rules:
      - path: ^internal/(launch/launch|game/stardew/smapi|datadir/open|backdrop/desktop|nxm/handler_linux|nxm/handler_windows|steam/steam|nativehost/spawn)\.go$
        linters: [gosec]
        text: G204
  settings:
    # canon go-golangci-lint-00008
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    # canon go-golangci-lint-00010
    exhaustive:
      check:
        - map
        - switch
    # canon go-golangci-lint-00013
    ireturn:
      allow:
        - anon
        - empty
        - error
        - generic
        - stdlib
        - github.com/Rethunk-AI/mortar/internal/game.Game
    # canon go-golangci-lint-00011
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/wailsapp/wails/v3
    # canon go-golangci-lint-00009
    gocritic:
      disabled-tags:
        - experimental
        - opinionated
        - performance
        - style
    # canon go-golangci-lint-00004
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # canon go-golangci-lint-00005
    staticcheck:
      checks: ["all"]
    # canon go-golangci-lint-00006
    nolintlint:
      require-explanation: true
      require-specific: true

# canon go-golangci-lint-00003
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# canon go-golangci-lint-00007
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    # canon go-golangci-lint-00012
    gofumpt:
      extra:
        group-params: true
