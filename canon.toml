reconciled = "canon v0.1.0-poc"

[deviations]
# Packaging is split across the matrix `release` job and `finalize`; there is no job named `build`.
# `finalize` holds id-token and attestations write, and contents write only for the publish steps.
"patterns-release-00003" = "no job named build: the matrix release job packages and finalize attests and publishes, so jobs.build.permissions is not a key this workflow has"
# Canon's generated-tree allowlist is present; extra allowlists cover authored fixtures that
# trip keyword detectors without holding secrets (the entry allows adding allowlists).
'patterns-gitleaks-00001 paths:_test\.go$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:\.test\.ts$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:frontend/src/demo/generated/recording\.json$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:^site/demo/' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:^components\.source\.json$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:^internal/components/components\.json$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
'patterns-gitleaks-00001 paths:^packages/flatpak/.*\.flatpak(ref|repo)$' = "allowlists add test fixtures, demo recordings, signed catalog IDs and Flatpak public GPG keys on top of canon's generated-tree list; those paths trip keyword detectors without holding secrets"
# Root scripts interleave Go and bun steps (wails bindings before typecheck, go test -race beside bun test), which a turbo task graph over the two JS packages cannot express.
"ts-patterns-workspace-turbo-00001" = "root scripts chain Go and bun steps (wails bindings, go test -race) that a turbo graph over frontend/ and web/ cannot model"
# go.mod replaces github.com/wailsapp/wails/v3 with the Rethunk-AI fork (TODO.md: "Mortar pins a Wails fork");
# gomoddirectives.replace-allow-list names it. A non-local replace is the only way to consume that fork until an
# upstream tag carries its hooks; a local replace would mean vendoring Wails.
'go-golangci-lint-00011 gomoddirectives.replace-allow-list:github.com/wailsapp/wails/v3' = "go.mod replaces wails/v3 with the Rethunk-AI fork until TODO.md's Wails fork entry (its Acceptance list) drops the replace for an upstream tag"
# The Astro site (web/) is English only and has no translation catalogue (translations are "not yet", AGENTS.md), so its
# templates' copy stays literal; the app frontend routes every string through Lingui and keeps the rule.
"ts-biome-00033" = "web/ is a single-language site with no i18n library; the Lingui frontend keeps noJsxLiterals on"
# Astro templates are HTML, not React: React's prop names (class, for) do not apply, and Fragment is Astro's own element.
"ts-biome-00006 suspicious/noUnknownAttribute **/*.astro" = "Astro templates are HTML, not React; React's prop names do not apply"
"ts-biome-00006 style/noJsxLiterals web/**" = "web/ is a single-language site with no i18n library; the Lingui frontend keeps noJsxLiterals on"
# The site's pages and data modules run at build time in Bun, reading the repo's files.
"ts-biome-00006 correctness/noNodejsModules web/src/lib/**" = "web/src/lib, web/src/pages and content.config.ts run at build time in Bun, reading the repo's files; build/linux/flathub/app-packages.ts runs under node or bun before yarn install"
"ts-biome-00006 correctness/noNodejsModules web/src/pages/**" = "web/src/lib, web/src/pages and content.config.ts run at build time in Bun, reading the repo's files; build/linux/flathub/app-packages.ts runs under node or bun before yarn install"
"ts-biome-00006 correctness/noNodejsModules build/linux/flathub/app-packages.ts" = "web/src/lib, web/src/pages and content.config.ts run at build time in Bun, reading the repo's files; build/linux/flathub/app-packages.ts runs under node or bun before yarn install"
# Registry lookups return whichever registered implementation matches: the interface is the point (.golangci.yml ireturn.allow).
'go-golangci-lint-00013 ireturn.allow:loader\.Loader' = "loader.Loader, game.Game, installer.(Installer|Archive|Game) and deploy.Deployer are registry lookups whose interface is the point, not hidden concrete types"
'go-golangci-lint-00013 ireturn.allow:game\.Game' = "loader.Loader, game.Game, installer.(Installer|Archive|Game) and deploy.Deployer are registry lookups whose interface is the point, not hidden concrete types"
'go-golangci-lint-00013 ireturn.allow:installer\.(Installer|Archive|Game)' = "loader.Loader, game.Game, installer.(Installer|Archive|Game) and deploy.Deployer are registry lookups whose interface is the point, not hidden concrete types"
'go-golangci-lint-00013 ireturn.allow:deploy\.Deployer' = "loader.Loader, game.Game, installer.(Installer|Archive|Game) and deploy.Deployer are registry lookups whose interface is the point, not hidden concrete types"
# forbidigo bans os.Remove/RemoveAll/ReadFile/WriteFile in favour of safefs; the one exclusion rule lists the paths that keep the plain calls.
'go-golangci-lint-00014 rules:(_test\.go$|^cmd/(components|version)/|^graphics_linux\.go$|^internal/sampler/ipc\.go$|^internal/cli/farm\.go$|^internal/gamesettings/types\.go$):forbidigo' = "forbidigo routes Mortar's own files through safefs (Windows antivirus and indexer locks, symlink refusal); tests, build tools, /proc reads, a CLI-named file and a game's options file keep the plain calls"
