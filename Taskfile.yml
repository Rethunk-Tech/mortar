version: "3"

vars:
  APP_NAME: "mortar"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:updater:
    summary: End-to-end self-updater test; builds two fixture apps and swaps the binary through a local signed manifest (tag updatetest is test-only)
    env:
      GOTMPDIR: /var/tmp
      TMPDIR: /var/tmp
    cmds:
      - go test -tags updatetest -count=1 -run TestUpdaterE2E ./internal/updatesvc

  selftest:
    summary: Runs Mortar in server mode against a sandboxed home with a copied game, for browser self-tests (scripts/selftest.sh)
    cmds:
      - scripts/selftest.sh {{.ARGS | default "start"}}

  clean-gate:
    summary: Runs the fresh-clone gate at REV (default HEAD) in one reused clean tree, and with PACKAGE=1 builds the AppImage (scripts/clean-gate.sh)
    cmds:
      - scripts/clean-gate.sh {{if .PACKAGE}}--package {{end}}{{.REV | default "HEAD"}}

  components:refresh:
    summary: Resolves, hashes and refreshes the bundled component manifest
    cmds:
      - GOTMPDIR=/var/tmp TMPDIR=/var/tmp go run ./cmd/components

  release:manifest:
    summary: Names the release assets in bin/ and writes the signed bin/manifest.json for VERSION
    requires:
      vars: [VERSION]
    preconditions:
      - sh: test -f "$MORTAR_UPDATE_KEY"
        msg: "MORTAR_UPDATE_KEY must name the updater's private key file"
      - sh: 'grep -q ''version: "{{.VERSION}}"'' build/config.yml'
        msg: "build/config.yml info.version is not {{.VERSION}}; an app built from it would offer itself the same update"
      - sh: go run ./cmd/version -check
        msg: "a copy of the version differs from build/config.yml; run go run ./cmd/version"
      - sh: test -f bin/mortar-linux-x86_64.AppImage && test -f bin/mortar-linux-amd64 && test -f bin/mortar-windows-amd64.exe
        msg: "need the amd64 AppImage, portable Linux binary and Windows exe; the arm64 ones join when present"
    cmds:
      - |
        set -euo pipefail
        assets=(bin/mortar-linux-x86_64.AppImage bin/mortar-linux-amd64 bin/mortar-windows-amd64.exe)
        for optional in bin/mortar-linux-aarch64.AppImage bin/mortar-linux-arm64 bin/mortar-windows-arm64.exe; do
          if [[ -f $optional ]]; then
            assets+=("$optional")
          fi
        done
        wails3 updater manifest -version {{.VERSION}} -key "$MORTAR_UPDATE_KEY" -url-prefix https://github.com/Rethunk-Tech/mortar/releases/download/v{{.VERSION}} -output bin/manifest.json "${assets[@]}"
        # The bare Linux binaries get their own platform so an AppImage never updates into one, nor the reverse
        # (updatesvc.PortablePlatform). Signatures cover each file's bytes, not the manifest, so this edit keeps them.
        jq '(.artifacts[] | select(.platform == "linux" and (.url | endswith(".AppImage") | not)) | .platform) = "linux-portable"' bin/manifest.json >bin/manifest.json.tmp
        mv bin/manifest.json.tmp bin/manifest.json
        test "$(jq '[.artifacts[] | select(.platform == "linux-portable")] | length' bin/manifest.json)" -ge 1
      - wails3 updater verify -manifest bin/manifest.json -publickey build/updater/public.key
