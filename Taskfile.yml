version: "3"

vars:
  APP_NAME: "mortar"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  selftest:
    summary: Runs Mortar in server mode against a sandboxed home with a copied game, for browser self-tests (scripts/selftest.sh)
    cmds:
      - scripts/selftest.sh {{.CLI_ARGS | default "start"}}

  components:refresh:
    summary: Resolves, hashes and refreshes the bundled component manifest
    cmds:
      - GOTMPDIR=/var/tmp TMPDIR=/var/tmp go run ./cmd/components

  release:manifest:
    summary: Names the release assets in bin/ and writes the signed bin/manifest.json for VERSION
    requires:
      vars: [VERSION]
    preconditions:
      - sh: test -f "$MORTAR_UPDATE_KEY"
        msg: "MORTAR_UPDATE_KEY must name the updater's private key file"
      - sh: 'grep -q ''version: "{{.VERSION}}"'' build/config.yml'
        msg: "build/config.yml info.version is not {{.VERSION}}; an app built from it would offer itself the same update"
      - sh: go run ./cmd/version -check
        msg: "a copy of the version differs from build/config.yml; run go run ./cmd/version"
      - sh: test -f bin/mortar-linux-x86_64.AppImage && test -f bin/mortar-windows-amd64.exe
        msg: "need the amd64 AppImage and Windows exe; include mortar-linux-aarch64.AppImage when the arm64 job has produced it"
    cmds:
      - |
        set -euo pipefail
        assets=(bin/mortar-linux-x86_64.AppImage bin/mortar-windows-amd64.exe)
        if [[ -f bin/mortar-linux-aarch64.AppImage ]]; then
          assets+=(bin/mortar-linux-aarch64.AppImage)
        fi
        wails3 updater manifest -version {{.VERSION}} -key "$MORTAR_UPDATE_KEY" -url-prefix https://github.com/Rethunk-AI/mortar/releases/download/v{{.VERSION}} -output bin/manifest.json "${assets[@]}"
      - wails3 updater verify -manifest bin/manifest.json -publickey build/updater/public.key
