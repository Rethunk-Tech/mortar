# bindings-fresh does not -clean, so the race tests can start at once beside it (scripts/gate.sh does the same).
[gates.typecheck]
run = "scripts/bindings-fresh.sh"

[gates.go]
run = "go test -race ./..."
timeout = "3m"

# Its own gate, so it runs beside the race tests rather than after them.
[gates.lint-go]
run = "golangci-lint run --allow-parallel-runners"
timeout = "3m"

# Bindings-fresh does not -clean, and a warm tree already has bindings and catalogs (HUMANS.md generates them
# before a first gate), so tsc and the JS tests start at once beside it.
[gates.test]
run = "bun run --cwd frontend tsc --noEmit & tsc=$!; bun run test:js; js=$?; wait $tsc; t=$?; [ $js -eq 0 ] && [ $t -eq 0 ]"

[gates.e2e]
run = "bun run --cwd frontend e2e"
timeout = "3m"
e2e = true

[gates.e2e-updater]
run = "bun run e2e:updater"
timeout = "3m"
e2e = true

[gates.perf]
run = "bun run perf"
timeout = "2m"
e2e = true
