# `bun run test` backgrounds its Go half inside bash -c, which gate cannot see into, so left alone both gates
# compile and run the race tests at once.
[gates.go]
needs = ["typecheck"]
run = "go test -race ./..."
timeout = "3m"

# Its own gate, so it runs beside the race tests rather than after them.
[gates.lint-go]
run = "golangci-lint run --allow-parallel-runners"
timeout = "3m"

# typecheck regenerates frontend/bindings with -clean (and a temp dir beside it); the JS tests import from it and the Go docs tests walk the tree.
[gates.test]
needs = ["typecheck"]
run = "bun run test:js"

[gates.e2e]
run = "bun run --cwd frontend e2e"
timeout = "3m"
e2e = true

[gates.e2e-updater]
run = "bun run e2e:updater"
timeout = "3m"
e2e = true

[gates.perf]
run = "bun run perf"
timeout = "2m"
e2e = true
