# `bun run test` backgrounds its Go half inside bash -c, which gate cannot see into, so left alone both gates
# compile and run the race tests at once.
[gates.go]
run = "GORACE=atexit_sleep_ms=0 go test -race ./... && golangci-lint run --allow-parallel-runners"
timeout = "3m"

[gates.test]
run = "bun run test:js"

[gates.e2e]
run = "bun run --cwd frontend e2e"
timeout = "3m"
e2e = true

[gates.e2e-updater]
run = "bun run e2e:updater"
timeout = "3m"
e2e = true

[gates.perf]
run = "bun run perf"
timeout = "2m"
e2e = true
