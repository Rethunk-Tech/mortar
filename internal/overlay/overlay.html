<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          24px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: rgb(23 32 43);
      }
      body.field {
        padding: 0;
        background: transparent;
      }
      #status {
        opacity: 0.8;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
      }
      .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.25rem 1rem;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="state" hidden>
      <div class="row">
        <strong id="player" class="player"></strong
        ><span id="location" class="location"></span>
      </div>
      <div class="row">
        <span id="date" class="date"></span><span id="time" class="time"></span>
      </div>
      <div class="row">
        <span id="season" class="season" hidden></span>
        <span id="day" class="day" hidden></span>
        <span id="year" class="year" hidden></span>
        <span id="money" class="money"></span
        ><span id="weather" class="weather"></span>
      </div>
      <div class="row">
        <span id="health" class="health"></span
        ><span id="stamina" class="stamina"></span>
      </div>
      <h3>Skills</h3>
      <div id="skills" class="skills">
        <span id="skill-farming" class="skill farming"></span>
        <span id="skill-fishing" class="skill fishing"></span>
        <span id="skill-foraging" class="skill foraging"></span>
        <span id="skill-mining" class="skill mining"></span>
        <span id="skill-combat" class="skill combat"></span>
        <span id="skill-luck" class="skill luck"></span>
      </div>
    </div>
    <div id="game" hidden></div>
    <div id="field" class="field" hidden></div>
    <script>
      "use strict";
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const port = params.get("port") || "8123";
      const field = params.get("field");
      const labeled = params.get("label") === "1";
      const endpoint = `http://127.0.0.1:${encodeURIComponent(port)}/state?token=${encodeURIComponent(token)}`;
      const status = document.querySelector("#status");
      const state = document.querySelector("#state");
      const fieldEl = document.querySelector("#field");
      const gameEl = document.querySelector("#game");

      const labels = {
        location: "Location",
        player: "Player",
        season: "Season",
        day: "Day",
        year: "Year",
        time: "Time",
        date: "Date",
        money: "Money",
        weather: "Weather",
        health: "Health",
        stamina: "Stamina",
        "skill.farming": "Farming",
        "skill.fishing": "Fishing",
        "skill.foraging": "Foraging",
        "skill.mining": "Mining",
        "skill.combat": "Combat",
        "skill.luck": "Luck",
      };

      function hide() {
        status.hidden = true;
        status.textContent = "";
        state.hidden = true;
        gameEl.hidden = true;
        gameEl.textContent = "";
        fieldEl.hidden = true;
        fieldEl.textContent = "";
      }

      // The game's clock is an integer HHMM (1830 is 6:30 PM).
      const CLOCK_HOUR = 100;
      const NOON = 12;
      const POLL_MS = 1000;

      function formatTime(timeOfDay) {
        let hours = Math.floor(timeOfDay / CLOCK_HOUR);
        const minutes = String(timeOfDay % CLOCK_HOUR).padStart(2, "0");
        const period = hours >= NOON ? "PM" : "AM";
        hours %= NOON;
        if (hours === 0) {
          hours = NOON;
        }
        return `${hours}:${minutes} ${period}`;
      }

      function seasonLabel(season) {
        return season ? season.charAt(0).toUpperCase() + season.slice(1) : "";
      }

      function valueFor(name, data) {
        switch (name) {
          case "location":
            return data.location;
          case "player":
            return data.playerName;
          case "season":
            return seasonLabel(data.season);
          case "day":
            return String(data.day);
          case "year":
            return String(data.year);
          case "time":
            return formatTime(data.timeOfDay);
          case "date":
            return `${seasonLabel(data.season)} ${data.day}, Year ${data.year}`;
          case "money":
            return `${data.money}g`;
          case "weather":
            return data.weather;
          case "health":
            return `${data.health}/${data.maxHealth}`;
          case "stamina":
            return `${Math.round(data.stamina)}/${data.maxStamina}`;
          default:
            if (name.startsWith("skill.")) {
              const skill = name.slice("skill.".length);
              const level = data.skills?.[skill];
              return has(level) ? String(level) : "";
            }
            return "";
        }
      }

      // One layout per game, chosen by the `game` the bridge reports; a snapshot without one is Stardew Valley's.
      // Each layout lists [field, label, text] in display order; a missing value is an empty text.
      const has = (v) => v !== undefined && v !== null;
      const text = (v, fn) => (has(v) ? fn(v) : "");
      const layouts = {
        "lethal-company": (d) => [
          ["player", "Player", text(d.playerName, String)],
          ["moon", "Moon", text(d.moon, String)],
          [
            "crew",
            "Crew",
            has(d.crewAlive) && has(d.crewTotal)
              ? `${d.crewAlive}/${d.crewTotal} alive`
              : "",
          ],
          ["day", "Day", text(d.day, String)],
          [
            "quota",
            "Quota",
            has(d.quotaProgress) && has(d.quota)
              ? `${d.quotaProgress}/${d.quota}`
              : "",
          ],
          ["daysLeft", "Days left", text(d.daysLeft, String)],
          ["credits", "Credits", text(d.credits, (v) => `\u25A0${v}`)],
        ],
        valheim: (d) => [
          ["player", "Player", text(d.playerName, String)],
          ["biome", "Biome", text(d.biome, String)],
          ["day", "Day", text(d.day, String)],
          [
            "bosses",
            "Bosses",
            has(d.bossCount) ? `${d.bossCount}/7 defeated` : "",
          ],
          [
            "bossList",
            "Defeated",
            Array.isArray(d.bossesDefeated) ? d.bossesDefeated.join(", ") : "",
          ],
        ],
      };

      function renderGame(rows) {
        status.hidden = true;
        status.textContent = "";
        state.hidden = true;
        if (field) {
          const row = rows.find((r) => r[0] === field);
          if (!row || row[2] === "") {
            hide();
            return;
          }
          fieldEl.id = field;
          fieldEl.className = `field ${field}`;
          fieldEl.textContent = labeled ? `${row[1]} ${row[2]}` : row[2];
          gameEl.hidden = true;
          fieldEl.hidden = false;
        } else {
          gameEl.textContent = "";
          for (const [name, label, value] of rows) {
            if (value === "") {
              continue;
            }
            const row = document.createElement("div");
            row.className = "row";
            const l = document.createElement("span");
            l.textContent = label;
            const v = document.createElement("strong");
            v.id = name;
            v.className = name;
            v.textContent = value;
            row.append(l, v);
            gameEl.append(row);
          }
          fieldEl.hidden = true;
          gameEl.hidden = false;
        }
      }

      function renderField(data) {
        const raw = valueFor(field, data);
        if (raw === "") {
          hide();
          return;
        }
        const hook = field.replaceAll(".", "-");
        fieldEl.id = hook;
        fieldEl.className = `field ${hook}`;
        fieldEl.textContent =
          labeled && labels[field] ? `${labels[field]} ${raw}` : raw;
        status.hidden = true;
        status.textContent = "";
        state.hidden = true;
        fieldEl.hidden = false;
      }

      function renderAll(data) {
        document.querySelector("#player").textContent = data.playerName;
        document.querySelector("#location").textContent = data.location;
        document.querySelector("#date").textContent = valueFor("date", data);
        document.querySelector("#time").textContent = valueFor("time", data);
        document.querySelector("#season").textContent = valueFor(
          "season",
          data,
        );
        document.querySelector("#day").textContent = valueFor("day", data);
        document.querySelector("#year").textContent = valueFor("year", data);
        document.querySelector("#money").textContent = `${data.money}g`;
        document.querySelector("#weather").textContent = data.weather;
        document.querySelector("#health").textContent =
          `Health ${valueFor("health", data)}`;
        document.querySelector("#stamina").textContent =
          `Stamina ${valueFor("stamina", data)}`;
        for (const skill of [
          "farming",
          "fishing",
          "foraging",
          "mining",
          "combat",
          "luck",
        ]) {
          const el = document.querySelector(`#skill-${skill}`);
          el.textContent = `${skill}: ${data.skills[skill]}`;
        }
        status.hidden = true;
        status.textContent = "";
        fieldEl.hidden = true;
        state.hidden = false;
      }

      async function poll() {
        try {
          const response = await fetch(endpoint, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          if (!data.inGame) {
            hide();
            return;
          }
          const layout = layouts[data.game];
          if (layout) {
            renderGame(layout(data));
          } else if (field) {
            renderField(data);
          } else {
            renderAll(data);
          }
        } catch {
          hide();
        }
      }

      if (field) {
        document.body.classList.add("field");
      }
      poll();
      setInterval(poll, POLL_MS);
    </script>
  </body>
</html>
