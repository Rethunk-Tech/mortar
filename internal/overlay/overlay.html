<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stardew Valley overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          24px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: #17202b;
      }
      body.field {
        padding: 0;
        background: transparent;
      }
      #status {
        opacity: 0.8;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
      }
      .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.25rem 1rem;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="state" hidden>
      <div class="row">
        <strong id="player" class="player"></strong
        ><span id="location" class="location"></span>
      </div>
      <div class="row">
        <span id="date" class="date"></span><span id="time" class="time"></span>
      </div>
      <div class="row">
        <span id="season" class="season" hidden></span>
        <span id="day" class="day" hidden></span>
        <span id="year" class="year" hidden></span>
        <span id="money" class="money"></span
        ><span id="weather" class="weather"></span>
      </div>
      <div class="row">
        <span id="health" class="health"></span
        ><span id="stamina" class="stamina"></span>
      </div>
      <h3>Skills</h3>
      <div id="skills" class="skills">
        <span id="skill-farming" class="skill farming"></span>
        <span id="skill-fishing" class="skill fishing"></span>
        <span id="skill-foraging" class="skill foraging"></span>
        <span id="skill-mining" class="skill mining"></span>
        <span id="skill-combat" class="skill combat"></span>
        <span id="skill-luck" class="skill luck"></span>
      </div>
    </div>
    <div id="field" class="field" hidden></div>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const port = params.get("port") || "8123";
      const field = params.get("field");
      const labeled = params.get("label") === "1";
      const endpoint = `http://127.0.0.1:${encodeURIComponent(port)}/state?token=${encodeURIComponent(token)}`;
      const status = document.querySelector("#status");
      const state = document.querySelector("#state");
      const fieldEl = document.querySelector("#field");
      let lastLogKey = "";

      const labels = {
        location: "Location",
        player: "Player",
        season: "Season",
        day: "Day",
        year: "Year",
        time: "Time",
        date: "Date",
        money: "Money",
        weather: "Weather",
        health: "Health",
        stamina: "Stamina",
        "skill.farming": "Farming",
        "skill.fishing": "Fishing",
        "skill.foraging": "Foraging",
        "skill.mining": "Mining",
        "skill.combat": "Combat",
        "skill.luck": "Luck",
      };

      function logOnce(key, message) {
        if (key === lastLogKey) return;
        lastLogKey = key;
        console.log(message);
      }

      function hide() {
        status.hidden = true;
        status.textContent = "";
        state.hidden = true;
        fieldEl.hidden = true;
        fieldEl.textContent = "";
      }

      function formatTime(timeOfDay) {
        let hours = Math.floor(timeOfDay / 100);
        const minutes = String(timeOfDay % 100).padStart(2, "0");
        const period = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        if (hours === 0) hours = 12;
        return `${hours}:${minutes} ${period}`;
      }

      function seasonLabel(season) {
        return season ? season.charAt(0).toUpperCase() + season.slice(1) : "";
      }

      function valueFor(name, data) {
        switch (name) {
          case "location":
            return data.location;
          case "player":
            return data.playerName;
          case "season":
            return seasonLabel(data.season);
          case "day":
            return String(data.day);
          case "year":
            return String(data.year);
          case "time":
            return formatTime(data.timeOfDay);
          case "date":
            return `${seasonLabel(data.season)} ${data.day}, Year ${data.year}`;
          case "money":
            return `${data.money}g`;
          case "weather":
            return data.weather;
          case "health":
            return `${data.health}/${data.maxHealth}`;
          case "stamina":
            return `${Math.round(data.stamina)}/${data.maxStamina}`;
          default:
            if (name.startsWith("skill.")) {
              const skill = name.slice("skill.".length);
              const level = data.skills?.[skill];
              return level == null ? "" : String(level);
            }
            return "";
        }
      }

      function renderField(data) {
        const raw = valueFor(field, data);
        if (raw === "") {
          hide();
          logOnce("empty", `overlay field ${field} is empty`);
          return;
        }
        const hook = field.replaceAll(".", "-");
        fieldEl.id = hook;
        fieldEl.className = `field ${hook}`;
        fieldEl.textContent =
          labeled && labels[field] ? `${labels[field]} ${raw}` : raw;
        status.hidden = true;
        status.textContent = "";
        state.hidden = true;
        fieldEl.hidden = false;
        logOnce("ok", "overlay ready");
      }

      function renderAll(data) {
        document.querySelector("#player").textContent = data.playerName;
        document.querySelector("#location").textContent = data.location;
        document.querySelector("#date").textContent = valueFor("date", data);
        document.querySelector("#time").textContent = valueFor("time", data);
        document.querySelector("#season").textContent = valueFor(
          "season",
          data,
        );
        document.querySelector("#day").textContent = valueFor("day", data);
        document.querySelector("#year").textContent = valueFor("year", data);
        document.querySelector("#money").textContent = `${data.money}g`;
        document.querySelector("#weather").textContent = data.weather;
        document.querySelector("#health").textContent =
          `Health ${valueFor("health", data)}`;
        document.querySelector("#stamina").textContent =
          `Stamina ${valueFor("stamina", data)}`;
        for (const skill of [
          "farming",
          "fishing",
          "foraging",
          "mining",
          "combat",
          "luck",
        ]) {
          const el = document.querySelector(`#skill-${skill}`);
          el.textContent = `${skill}: ${data.skills[skill]}`;
        }
        status.hidden = true;
        status.textContent = "";
        fieldEl.hidden = true;
        state.hidden = false;
        logOnce("ok", "overlay ready");
      }

      async function poll() {
        try {
          const response = await fetch(endpoint, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!data.inGame) {
            hide();
            logOnce("idle", "overlay: not in game");
            return;
          }
          if (field) renderField(data);
          else renderAll(data);
        } catch (error) {
          hide();
          logOnce("error", `overlay unavailable: ${error.message}`);
        }
      }

      if (field) document.body.classList.add("field");
      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
