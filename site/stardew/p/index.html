<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>Mortar: shared Stardew Valley profile</title>
    <link rel="stylesheet" href="../../base.css" />
    <style>
      :root {
        --error: rgb(199, 10, 10);
      }
      .title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      ul {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        max-height: 45vh;
        overflow: auto;
      }
      li {
        padding: 0.3rem 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .btn.alt {
        background: transparent;
        color: var(--sand);
        border: 1px solid var(--sand);
      }
      #error {
        border-left: 4px solid var(--error);
      }
      .card[hidden],
      .btn[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg
          width="32"
          height="32"
          viewBox="0 0 64 64"
          aria-hidden="true"
          fill="currentColor"
        >
          <rect x="6" y="12" width="24" height="11" rx="2" />
          <rect x="34" y="12" width="24" height="11" rx="2" />
          <rect x="6" y="27" width="10" height="11" rx="2" />
          <rect x="20" y="27" width="24" height="11" rx="2" />
          <rect x="48" y="27" width="10" height="11" rx="2" />
          <rect x="6" y="42" width="24" height="11" rx="2" />
          <rect x="34" y="42" width="24" height="11" rx="2" />
        </svg>
        <span>Mortar</span>
      </header>
      <p id="error" class="card" hidden></p>
      <noscript
        ><p class="card">
          This page needs JavaScript to read the shared profile.
        </p></noscript
      >
      <section id="profile" class="card" hidden>
        <p class="muted">Stardew Valley profile shared with you</p>
        <p id="name" class="title"></p>
        <p class="muted">
          <span id="count"></span>. Mortar resolves mod names when you import.
        </p>
        <ul id="list"></ul>
      </section>
      <div class="actions">
        <a id="open" class="btn" href="mortar://stardew/p/" hidden
          >Open in Mortar</a
        >
        <a id="download" class="btn alt" href="/download/" hidden>Get Mortar</a>
        >
      </div>
      <p id="copied" class="muted" hidden>
        Link copied. After installing Mortar, paste it into Import.
      </p>
      <p class="muted">
        Everything on this page happens in your browser; the profile is never
        sent anywhere.
      </p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
