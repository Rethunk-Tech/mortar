# This file contains the configuration for this project.
# When you update `info`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Rethunk.Tech" # The name of the company
  productName: "Mortar" # The name of the application
  productIdentifier: "tech.rethunk.mortar" # The unique product identifier
  description: "Multi-game desktop mod manager" # The application description
  copyright: "(c) 2026, Rethunk.Tech" # Copyright text
  version: "0.0.1" # The application version

protocols:
  - scheme: mortar
    description: Mortar link

fileAssociations:
  - ext: mortar
    name: Mortar profile
    description: Mortar profile
    iconName: appicon
    role: Editor
    mimeType: application/x-mortar

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # The standard frontend task waits up to 60s for HTTP 200 from
      # FRONTEND_DEVSERVER_URL before starting the app. Override if needed;
      # custom background commands can opt in with the same readiness block.
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

