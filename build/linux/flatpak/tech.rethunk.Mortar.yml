app-id: tech.rethunk.Mortar
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mortar
finish-args:
  # The WebKitGTK window, and controllers for gamepad navigation. The input device type needs Flatpak 1.16, and
  # Ubuntu 24.04 and Debian 12 ship older than that; so this grants every device (which includes the GPU.)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  # Mod downloads and catalog updates.
  - --share=network
  # Steam libraries: native, Debian and Ubuntu's (~/.steam/debian-installation), the Snap and the Flatpak.
  - --filesystem=xdg-data/Steam
  - --filesystem=~/.steam
  - --filesystem=~/snap/steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  # Heroic: we read its configs to find what it installed. The Flatpak gets its own folder too.
  - --filesystem=xdg-config/heroic:ro
  - --filesystem=~/snap/heroic:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  # Lutris: we read its game configs (older releases keep them under xdg-config.) The Flatpak gets its own folder too.
  - --filesystem=xdg-data/lutris:ro
  - --filesystem=xdg-config/lutris:ro
  - --filesystem=~/.var/app/net.lutris.Lutris
  # Bottles: native and Flatpak.
  - --filesystem=xdg-data/bottles
  - --filesystem=~/.var/app/com.usebottles.bottles/data/bottles
  # Where GOG installs by default, and ~/Games for Heroic and Lutris.
  - --filesystem=~/GOG Games
  - --filesystem=~/Games
  # Game libraries on other drives. Removable drives mount under /run/media on Fedora and Arch, /media on Debian and Ubuntu.
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # Stardew Valley's saves, for save backups and the per-save mod list.
  - --filesystem=xdg-config/StardewValley
  # Mod archives you downloaded by hand.
  - --filesystem=xdg-download
  # We read r2modman's and Gale's data folders so Import can bring their profiles over.
  - --filesystem=xdg-config/r2modmanPlus-local:ro
  - --filesystem=xdg-data/com.kesomannen.gale:ro
  # Desktop notifications and the tray icon talk to these names directly (no portal.)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # The tray item's name has the process id in it, which is 2 inside the sandbox.
  - --own-name=org.kde.StatusNotifierItem-2-1
  # flatpak-spawn --host: without it we can't start a game through the host's Steam or launcher.
  - --talk-name=org.freedesktop.Flatpak
# Develop builds mods with Flathub's .NET SDK. no-autodownload leaves the 700 MB extension to the player, and Develop's
# Prerequisites prints the install command; its branch is the freedesktop release the GNOME runtime sits on.
add-extensions:
  org.freedesktop.Sdk.Extension.dotnet10:
    directory: extensions/dotnet10
    version: "26.08"
    no-autodownload: true
modules:
  - name: mortar
    buildsystem: simple
    build-commands:
      # Flatpak mounts the extension here but cannot create the folder in the read-only /app.
      - install -d /app/extensions/dotnet10
      - install -Dm755 mortar-packaged /app/bin/mortar
      - install -Dm644 tech.rethunk.Mortar.desktop /app/share/applications/tech.rethunk.Mortar.desktop
      - install -Dm644 mortar.xml /app/share/mime/packages/tech.rethunk.Mortar.xml
      - install -Dm644 tech.rethunk.Mortar.metainfo.xml /app/share/metainfo/tech.rethunk.Mortar.metainfo.xml
      - install -Dm644 tech.rethunk.Mortar-512.png /app/share/icons/hicolor/512x512/apps/tech.rethunk.Mortar.png
      - install -Dm644 tech.rethunk.Mortar-256.png /app/share/icons/hicolor/256x256/apps/tech.rethunk.Mortar.png
      - install -Dm644 appicon.svg /app/share/icons/hicolor/scalable/apps/tech.rethunk.Mortar.svg
      - install -Dm644 LICENSE /app/share/doc/mortar/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES /app/share/doc/mortar/THIRD_PARTY_NOTICES
    sources:
      - type: file
        path: ../../../bin/mortar-packaged
      - type: file
        path: ../tech.rethunk.Mortar.desktop
      - type: file
        path: ../mime/mortar.xml
      - type: file
        path: ../tech.rethunk.Mortar.metainfo.xml
      - type: file
        path: ../icons/tech.rethunk.Mortar-512.png
      - type: file
        path: ../icons/tech.rethunk.Mortar-256.png
      - type: file
        path: ../../appicon.svg
      - type: file
        path: ../../../LICENSE
      - type: file
        path: ../../../THIRD_PARTY_NOTICES
