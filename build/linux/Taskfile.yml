version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:arm64:
    summary: Cross-compiles linux/arm64 (zig cc + Ubuntu 24.04 sysroot, no binfmt)
    cmds:
      - bash build/linux/cross-arm64.sh

  build:
    summary: Builds the application for Linux (CGO, native host only)
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          PACKAGED: '{{.PACKAGED}}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
      - task: generate:dotdesktop
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.18.0 (requires Go 1.27+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{if .PACKAGED}} -buildmode=pie{{end}}{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s{{if .PACKAGED}} -X main.packaged={{.PACKAGED}} -X github.com/Rethunk-AI/mortar/internal/nxm.packaged={{.PACKAGED}} -extldflags ''-Wl,-z,relro,-z,now''{{end}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      PACKAGED: '{{.PACKAGED}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
    cmds:
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
      - task: generate:dotdesktop
    cmds:
      - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
      - cp ../../appicon.png "{{.APP_NAME}}.png"
      - |
        set -euo pipefail
        arch="${APPIMAGE_ARCH:-$(uname -m)}"
        appdir="{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-${arch}.AppDir"
        mkdir -p "$appdir/usr/share/doc/mortar"
        cp "{{.ROOT_DIR}}/LICENSE" "{{.ROOT_DIR}}/THIRD_PARTY_NOTICES" "$appdir/usr/share/doc/mortar/"
      - wails3 generate appimage -binary "{{.APP_NAME}}" -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
      - |
        set -euo pipefail
        arch="${APPIMAGE_ARCH:-$(uname -m)}"
        mv "{{.OUTPUT_DIR}}/{{.APP_NAME}}-${arch}.AppImage" "{{.OUTPUT_DIR}}/{{.APP_NAME}}-linux-${arch}.AppImage"
        appdir="{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-${arch}.AppDir"
        mkdir -p "$appdir/usr/share/doc/mortar"
        cp "{{.ROOT_DIR}}/LICENSE" "{{.ROOT_DIR}}/THIRD_PARTY_NOTICES" "$appdir/usr/share/doc/mortar/"
        if command -v appimagetool >/dev/null 2>&1; then
          ARCH="$arch" appimagetool "$appdir" "{{.OUTPUT_DIR}}/{{.APP_NAME}}-linux-${arch}.AppImage"
        fi
        rm "{{.APP_NAME}}" "{{.APP_NAME}}.png"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'

  nfpm:
    summary: Builds .deb, .rpm and Arch packages (self-updater off)
    deps:
      - task: build
        vars:
          PACKAGED: deb
          OUTPUT: '{{.BIN_DIR}}/mortar-packaged'
    cmds:
      - |
        set -euo pipefail
        VERSION="$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml)"
        : "${VERSION:?build/config.yml has no info.version}"
        export VERSION
        export NFPM_ARCH="${NFPM_ARCH:-$(go env GOARCH)}"
        case "$NFPM_ARCH" in
          amd64) rpm_arch=x86_64; pkg_arch=x86_64; bin_arch=amd64 ;;
          arm64) rpm_arch=aarch64; pkg_arch=aarch64; bin_arch=arm64 ;;
          *) echo "unsupported NFPM_ARCH=$NFPM_ARCH" >&2; exit 1 ;;
        esac
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager deb --target "bin/mortar_${VERSION}_${NFPM_ARCH}.deb"
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager rpm --target "bin/mortar-${VERSION}-1.${rpm_arch}.rpm"
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager archlinux --target "bin/mortar-${VERSION}-1-${pkg_arch}.pkg.tar.zst"
        cp -a "{{.BIN_DIR}}/mortar-packaged" "{{.BIN_DIR}}/mortar-linux-${bin_arch}"

  flatpak:
    summary: Builds a single-file Flatpak bundle (self-updater off)
    deps:
      - task: build
        vars:
          PACKAGED: flatpak
          OUTPUT: '{{.BIN_DIR}}/mortar-packaged'
    cmds:
      - |
        set -euo pipefail
        dest="${PWD}/bin/mortar-linux-x86_64.flatpak"
        mkdir -p bin
        flatpak-builder --user --force-clean --install-deps-from=flathub --repo=/var/tmp/mortar-flatpak-repo /var/tmp/mortar-flatpak-build build/linux/flatpak/tech.rethunk.Mortar.yml
        flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo /var/tmp/mortar-flatpak-repo "$dest" tech.rethunk.Mortar

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "Mortar" -exec "{{.EXEC}}" -icon "{{.ICON}}" -comment "Multi-game desktop mod manager" -keywords "mod;manager;nexus;stardew;" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Game;Utility;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
