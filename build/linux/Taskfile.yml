version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:arm64:
    summary: Cross-compiles linux/arm64 (zig cc + Ubuntu 24.04 sysroot, no binfmt)
    cmds:
      - bash build/linux/cross-arm64.sh

  build:
    summary: Builds the application for Linux (CGO, native host only)
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          PACKAGED: '{{.PACKAGED}}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.18.0 (requires Go 1.27+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{if .PACKAGED}} -buildmode=pie{{end}}{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s{{if .PACKAGED}} -X main.packaged={{.PACKAGED}} -X github.com/Rethunk-Tech/mortar/internal/nxm.packaged={{.PACKAGED}} -extldflags ''-Wl,-z,relro,-z,now''{{end}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      PACKAGED: '{{.PACKAGED}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
    cmds:
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
    cmds:
      - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
      - cp ../../appicon.png "tech.rethunk.Mortar.png"
      - wails3 generate appimage -binary "{{.APP_NAME}}" -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
      - |
        set -euo pipefail
        arch="${APPIMAGE_ARCH:-$(uname -m)}"
        build="{{.ROOT_DIR}}/build/linux/appimage/build"
        appdir="$build/{{.APP_NAME}}-${arch}.AppDir"
        # AppRun checks the host glibc before starting Mortar, then the AppDir is packed again with the linuxdeploy
        # wails3 just used.
        cp "{{.ROOT_DIR}}/build/linux/appimage/glibc-check.sh" "$appdir/glibc-check.sh"
        grep -q 'glibc-check.sh' "$appdir/AppRun" || sed -i '/^APPDIR=/a . "$APPDIR/glibc-check.sh"' "$appdir/AppRun"
        grep -q '^\. "$APPDIR/glibc-check.sh"$' "$appdir/AppRun"
        mkdir -p "$appdir/usr/share/doc/mortar"
        cp "{{.ROOT_DIR}}/LICENSE" "{{.ROOT_DIR}}/THIRD_PARTY_NOTICES" "$appdir/usr/share/doc/mortar/"
        (cd "$build" && OUTPUT="{{.APP_NAME}}-linux-${arch}.AppImage" "./linuxdeploy-${arch}.AppImage" --appimage-extract-and-run --appdir "$appdir" --output appimage)
        mv "$build/{{.APP_NAME}}-linux-${arch}.AppImage" "{{.OUTPUT_DIR}}/{{.APP_NAME}}-linux-${arch}.AppImage"
        rm "{{.OUTPUT_DIR}}/{{.APP_NAME}}-${arch}.AppImage"
        # The bare program beside the AppImage is the same unpackaged build: a portable binary that updates itself.
        case "$arch" in x86_64) goarch=amd64 ;; aarch64) goarch=arm64 ;; *) echo "unsupported arch $arch" >&2; exit 1 ;; esac
        cp -a "{{.APP_BINARY}}" "{{.OUTPUT_DIR}}/{{.APP_NAME}}-linux-${goarch}"
        rm "{{.APP_NAME}}" "tech.rethunk.Mortar.png"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: 'tech.rethunk.Mortar.png'
      DESKTOP_FILE: '../tech.rethunk.Mortar.desktop'
      OUTPUT_DIR: '../../../bin'

  nfpm:
    summary: Builds .deb, .rpm and Arch packages (self-updater off)
    deps:
      - task: build
        vars:
          PACKAGED: deb
          OUTPUT: '{{.BIN_DIR}}/mortar-packaged'
    cmds:
      - |
        set -euo pipefail
        VERSION="$(go run ./cmd/version -print)"
        export VERSION
        export NFPM_ARCH="${NFPM_ARCH:-$(go env GOARCH)}"
        case "$NFPM_ARCH" in
          amd64) rpm_arch=x86_64; pkg_arch=x86_64; bin_arch=amd64 ;;
          arm64) rpm_arch=aarch64; pkg_arch=aarch64; bin_arch=arm64 ;;
          *) echo "unsupported NFPM_ARCH=$NFPM_ARCH" >&2; exit 1 ;;
        esac
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager deb --target "bin/mortar_${VERSION}_${NFPM_ARCH}.deb"
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager rpm --target "bin/mortar-${VERSION}-1.${rpm_arch}.rpm"
        nfpm package --config build/linux/nfpm/nfpm.yaml --packager archlinux --target "bin/mortar-${VERSION}-1-${pkg_arch}.pkg.tar.zst"
        cp -a "{{.BIN_DIR}}/mortar-packaged" "{{.BIN_DIR}}/mortar-aur-linux-${bin_arch}"

  flatpak:arm64:
    summary: Builds bin/mortar-linux-aarch64.flatpak on x86_64 (cross build + qemu binfmt in a user namespace, no root)
    cmds:
      - bash build/linux/flatpak/build-aarch64.sh

  flatpak:
    summary: Builds a single-file Flatpak bundle (self-updater off)
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          PACKAGED: flatpak
          OUTPUT: '{{.BIN_DIR}}/mortar-packaged'
    cmds:
      - |
        set -euo pipefail
        arch={{if eq (.ARCH | default ARCH) "arm64"}}aarch64{{else}}x86_64{{end}}
        dest="${PWD}/bin/mortar-linux-${arch}.flatpak"
        mkdir -p bin
        flatpak-builder --arch="$arch" --user --force-clean --state-dir="/var/tmp/mortar-flatpak-state-${arch}" --install-deps-from=flathub --repo=/var/tmp/mortar-flatpak-repo "/var/tmp/mortar-flatpak-build-${arch}" build/linux/flatpak/tech.rethunk.Mortar.yml
        flatpak build-bundle --arch="$arch" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo /var/tmp/mortar-flatpak-repo "$dest" tech.rethunk.Mortar

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
