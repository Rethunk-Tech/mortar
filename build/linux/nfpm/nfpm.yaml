name: mortar
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: games
priority: optional
maintainer: Rethunk.Tech <https://github.com/Rethunk-AI/mortar>
description: Desktop mod manager for Stardew Valley
homepage: https://github.com/Rethunk-AI/mortar
license: AGPL-3.0-only
contents:
  - src: bin/mortar-packaged
    dst: /usr/bin/mortar
    file_info:
      mode: 0755
  - src: build/linux/tech.rethunk.Mortar.desktop
    dst: /usr/share/applications/tech.rethunk.Mortar.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/tech.rethunk.Mortar.png
overrides:
  deb:
    depends:
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - webkitgtk6.0
  archlinux:
    depends:
      - webkitgtk-6.0
depends:
  - webkitgtk-6.0
