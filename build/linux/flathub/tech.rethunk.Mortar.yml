app-id: tech.rethunk.Mortar
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mortar
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-config/StardewValley
  - --filesystem=xdg-data/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.config/StardewValley
  - --filesystem=xdg-config/heroic:ro
  - --filesystem=xdg-data/lutris:ro
  - --filesystem=~/.var/app/net.lutris.Lutris
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  - --filesystem=~/GOG Games
  - --filesystem=~/Games/Heroic
  - --filesystem=xdg-data/mortar
  - --own-name=tech.rethunk.mortar.SingleInstance
modules:
  - name: mortar
    buildsystem: simple
    build-commands:
      - install -Dm755 mortar /app/bin/mortar
      - install -Dm644 tech.rethunk.Mortar.desktop /app/share/applications/tech.rethunk.Mortar.desktop
      - install -Dm644 mortar.xml /app/share/mime/packages/tech.rethunk.Mortar.xml
      - install -Dm644 tech.rethunk.Mortar.metainfo.xml /app/share/metainfo/tech.rethunk.Mortar.metainfo.xml
      - install -Dm644 tech.rethunk.Mortar-512.png /app/share/icons/hicolor/512x512/apps/tech.rethunk.Mortar.png
      - install -Dm644 tech.rethunk.Mortar-256.png /app/share/icons/hicolor/256x256/apps/tech.rethunk.Mortar.png
      - install -Dm644 appicon.svg /app/share/icons/hicolor/scalable/apps/tech.rethunk.Mortar.svg
      - install -Dm644 LICENSE /app/share/doc/mortar/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES /app/share/doc/mortar/THIRD_PARTY_NOTICES
    sources:
      - type: file
        url: https://github.com/Rethunk-AI/mortar/releases/download/v@VERSION@/mortar-linux-amd64
        sha256: '@sha:bin/mortar-linux-amd64@'
        dest-filename: mortar
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/linux/tech.rethunk.Mortar.desktop
        sha256: '@sha:build/linux/tech.rethunk.Mortar.desktop@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/linux/mime/mortar.xml
        sha256: '@sha:build/linux/mime/mortar.xml@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/linux/tech.rethunk.Mortar.metainfo.xml
        sha256: '@sha:build/linux/tech.rethunk.Mortar.metainfo.xml@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/linux/icons/tech.rethunk.Mortar-512.png
        sha256: '@sha:build/linux/icons/tech.rethunk.Mortar-512.png@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/linux/icons/tech.rethunk.Mortar-256.png
        sha256: '@sha:build/linux/icons/tech.rethunk.Mortar-256.png@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/build/appicon.svg
        sha256: '@sha:build/appicon.svg@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/LICENSE
        sha256: '@sha:LICENSE@'
      - type: file
        url: https://raw.githubusercontent.com/Rethunk-AI/mortar/v@VERSION@/THIRD_PARTY_NOTICES
        sha256: '@sha:THIRD_PARTY_NOTICES@'
