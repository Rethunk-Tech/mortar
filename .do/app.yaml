# App Platform spec for the share page at mortar.rethunk.tech. Static site: App Platform
# offers no response-header setting for static sites, so the page carries its own
# robots and referrer meta tags and the fleet header set (no HSTS, no CSP) is not applied.
name: mortar-site
region: sfo
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: mortar.rethunk.tech
    type: PRIMARY
    zone: rethunk.tech
static_sites:
  - name: site
    github:
      repo: Rethunk-Tech/mortar
      branch: main
      deploy_on_push: false
    environment_slug: html
    source_dir: site
    routes:
      - path: /
  # The signed apt, dnf and pacman repository: package-repo.yml force-replaces the orphan `packages` branch each release.
  - name: packages
    github:
      repo: Rethunk-Tech/mortar
      branch: packages
      deploy_on_push: true
    environment_slug: html
    source_dir: /
    routes:
      - path: /packages
