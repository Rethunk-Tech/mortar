name: Package repository

# Builds the signed apt, dnf and pacman repository from a published release's packages and publishes it, with the
# tag's site, as the single commit of the orphan `packages` branch that mortar.rethunk.tech deploys on push
# (.do/app.yaml), so the site changes only with a release. release.yml calls it after each release; a manual run
# rebuilds both for an existing tag, and with `site` set publishes that ref's site beside the tag's packages instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.2.0
        required: true
      site:
        description: Ref whose site to publish instead of the tag's, for a site refresh between releases
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      MORTAR_REPO_GPG_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  package-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout the site
        if: inputs.site != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.site }}
          path: site-src
          persist-credentials: false

      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D bin -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst' -p '*.flatpak'

      - name: Build the package repository
        env:
          REPO_KEY: ${{ secrets.MORTAR_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/repo.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$REPO_KEY" >"$key")
          MORTAR_REPO_KEY="$key" scripts/package-repo.sh bin "$RUNNER_TEMP/packages"

      - name: Upload the package repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-repo-${{ inputs.tag }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      # The site's demo is the app's own frontend, so it needs Bun, the workspace and the generated bindings.
      - name: Set up Mortar
        uses: ./.github/actions/setup-mortar
        with:
          native: "false"

      # Other managers' counts and releases and the Steam art move between releases; the tag's site is rebuilt with
      # them fresh so a published claim is never older than the publish. A site from another ref is built as it is.
      - name: Refresh the site's outside facts
        if: inputs.site == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run site:refresh

      - name: Build the site
        if: inputs.site == ''
        run: bun run site

      - name: Build the site from its ref
        if: inputs.site != ''
        working-directory: site-src
        run: bun install --frozen-lockfile && bun run bindings && bun run site

      # The site's download links follow the latest release, so a renamed asset breaks them the moment it publishes.
      - name: Site download links
        if: inputs.site == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/site-downloads.ts

      # The search index is built over the finished pages and is never committed, so the published tree gets it here.

      - name: Index the site for search
        env:
          SITE_FROM: ${{ inputs.site != '' && 'site-src/site' || 'site' }}
        run: bunx pagefind@1.5.2 --site "$SITE_FROM" --output-subdir pagefind

      # The branch holds only the latest repository: one orphan commit, force-replaced, so its history never grows.
      - name: Publish the packages branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SITE_FROM: ${{ inputs.site != '' && 'site-src/site' || 'site' }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/branch"
          mkdir "$tree"
          cp -r "$SITE_FROM" "$tree/site"
          cp -r "$RUNNER_TEMP/packages" "$tree/packages"
          cd "$tree"
          git init -q -b packages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "packages: $TAG"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" packages:packages
