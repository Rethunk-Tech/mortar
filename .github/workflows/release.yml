name: Release

# A v* tag builds, signs and publishes the release. A manual dispatch is the dry run: it runs every step on both
# legs, including the signed manifest, package-manager sources, release notes and a check of the staged files, and
# only skips the GitHub release, so packaging faults show up before a tag exists. Linux arm64 is the second matrix
# leg (ubuntu-24.04-arm); the signed manifest is assembled after both legs so it can name both AppImages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goarch: amd64, appimage_arch: x86_64, deb_arch: amd64, rpm_arch: x86_64, pkg_arch: x86_64, windows: true, flatpak: true }
          - { runner: ubuntu-24.04-arm, goarch: arm64, appimage_arch: aarch64, deb_arch: arm64, rpm_arch: aarch64, pkg_arch: aarch64, windows: false, flatpak: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      NFPM_ARCH: ${{ matrix.deb_arch }}
      APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag normally points at a commit CI already gated on main; re-running the gate then buys nothing.
      # Dispatch runs always gate.
      - name: Gate needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          passed=0
          if [ "$REF_TYPE" = tag ]; then
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)"
          fi
          if [ "$GOARCH" != amd64 ]; then
            echo "The gate runs on the amd64 leg only, as in ci.yml"
            echo "run=false" >>"$GITHUB_OUTPUT"
          elif [ "$passed" -gt 0 ]; then
            echo "CI already passed on $GITHUB_SHA; skipping the gate"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Mortar
        uses: ./.github/actions/setup-mortar
        with:
          apt-packages: appstream
          lint-tools: ${{ steps.gate.outputs.run }}
          nfpm: "true"

      - name: NSIS
        if: matrix.windows
        run: sudo apt-get install -y --no-install-recommends nsis

      - name: Version agreement
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # build/config.yml is the one place the version is set; the gate checks every copy against it.
          cfg_ver="$(go run ./cmd/version -print)"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$cfg_ver" ]; then
            echo "tag $REF_NAME does not match build/config.yml version $cfg_ver" >&2
            exit 1
          fi

      - name: Offline gate
        if: steps.gate.outputs.run == 'true'
        run: bun run gate

      - name: Linux AppImage
        run: wails3 task linux:create:appimage

      - name: Linux deb, rpm and Arch packages
        run: sudo apt-get install -y --no-install-recommends rpm && wails3 task linux:nfpm

      - name: Flatpak runtime version
        id: flatpak-runtime
        if: matrix.flatpak
        run: |
          echo "version=$(sed -n 's/^runtime-version: "\(.*\)"$/\1/p' build/linux/flatpak/tech.rethunk.Mortar.yml)" >>"$GITHUB_OUTPUT"

      # The user installation holds the GNOME runtime, SDK and Flathub's builder, the slow part of the build.
      - name: Flatpak SDK cache
        if: matrix.flatpak
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-user-gnome-${{ steps.flatpak-runtime.outputs.version }}

      - name: Linux Flatpak
        if: matrix.flatpak
        run: |
          # The GNOME SDK, the build and its repo need more space than the hosted runner leaves free; these
          # preinstalled toolchains are unused here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Flathub's own builder: the distro flatpak-builder composes AppStream with the runner's older appstream,
          # which fails on the GNOME 51 SDK.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec flatpak run --filesystem=home --filesystem=/var/tmp org.flatpak.Builder "$@"\n' > "$RUNNER_TEMP/bin/flatpak-builder"
          chmod +x "$RUNNER_TEMP/bin/flatpak-builder"
          # The sandboxed builder installs the SDK through the host's flatpak over the session bus, which a headless
          # runner does not have.
          PATH="$RUNNER_TEMP/bin:$PATH" dbus-run-session -- wails3 task linux:flatpak

      - name: Windows exe and installer
        if: matrix.windows
        run: |
          # Both architectures write bin/mortar.exe, so each is copied out before the next build. NSIS builds
          # an arm64-native installer from the arm64 exe (bin/mortar-arm64-installer.exe).
          wails3 task windows:package INSTALL_SCOPE=user ARCH=amd64
          cp bin/mortar.exe bin/mortar-windows-amd64.exe
          wails3 task windows:package INSTALL_SCOPE=user ARCH=arm64
          cp bin/mortar.exe bin/mortar-windows-arm64.exe

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp "bin/mortar-linux-${{ matrix.appimage_arch }}.AppImage" out/
          cp "bin/mortar-linux-${{ matrix.goarch }}" "bin/mortar-aur-linux-${{ matrix.goarch }}" out/
          cp bin/mortar_*_${{ matrix.deb_arch }}.deb out/
          cp bin/mortar-*.${{ matrix.rpm_arch }}.rpm out/
          cp bin/mortar-*-${{ matrix.pkg_arch }}.pkg.tar.zst out/
          if [ "${{ matrix.flatpak }}" = true ]; then
            cp bin/mortar-linux-x86_64.flatpak out/
          fi
          if [ "${{ matrix.windows }}" = true ]; then
            cp bin/mortar-windows-amd64.exe bin/mortar-amd64-installer.exe \
              bin/mortar-windows-arm64.exe bin/mortar-arm64-installer.exe out/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mortar-linux-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error

  finalize:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history: the release notes read the commits since the previous tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Mortar
        uses: ./.github/actions/setup-mortar
        with:
          frontend: "false"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bin
          merge-multiple: true

      - name: Signed manifest
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="$(go run ./cmd/version -print)"
          fi
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          MORTAR_UPDATE_KEY="$key" wails3 task release:manifest VERSION="$version"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mortar
          path: |
            bin/mortar-linux-x86_64.AppImage
            bin/mortar-linux-amd64
            bin/mortar-aur-linux-amd64
            bin/mortar_*_amd64.deb
            bin/mortar-*-1.x86_64.rpm
            bin/mortar-*-1-x86_64.pkg.tar.zst
            bin/mortar-linux-x86_64.flatpak
            bin/mortar-linux-aarch64.AppImage
            bin/mortar-linux-arm64
            bin/mortar-aur-linux-arm64
            bin/mortar_*_arm64.deb
            bin/mortar-*-1.aarch64.rpm
            bin/mortar-*-1-aarch64.pkg.tar.zst
            bin/mortar-windows-amd64.exe
            bin/mortar-amd64-installer.exe
            bin/mortar-windows-arm64.exe
            bin/mortar-arm64-installer.exe
            bin/manifest.json
          if-no-files-found: error

      # The Flathub render writes the npm sources with bun and flatpak-node-generator (run through uvx).
      - name: Setup Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13

      - name: uv
        run: pipx install uv==0.12.23

      - name: Package manager sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build/linux/aur/render.sh bin bin/aur
          build/linux/flathub/render.sh bin/flathub
          cp bin/aur/PKGBUILD bin/PKGBUILD
          cp bin/aur/.SRCINFO bin/SRCINFO
          for f in tech.rethunk.Mortar.yml go-sources.json node-sources.json yarn.lock SUBMISSION.md; do
            cp "bin/flathub/$f" "bin/flathub-$f"
          done
          rm -r bin/aur bin/flathub

      # SHA256SUMS lets a person check any download by hand; its signature uses the same key as the package repository.
      - name: Checksums and signature
        env:
          REPO_KEY: ${{ secrets.MORTAR_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          (cd bin && sha256sum -- * >../SHA256SUMS) && mv SHA256SUMS bin/
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$REPO_KEY" | gpg --batch --quiet --import
          want=$(gpg --with-colons --show-keys build/linux/repo/mortar-archive-keyring.asc | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --yes --local-user "$want" --armor --detach-sign -o bin/SHA256SUMS.asc bin/SHA256SUMS
          gpg --batch --verify bin/SHA256SUMS.asc bin/SHA256SUMS

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/*

      - name: Release notes
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            build/release/notes.sh "$REF_NAME" >notes.md
          else
            build/release/notes.sh "v$(go run ./cmd/version -print)" HEAD >notes.md
          fi
          cat notes.md >>"$GITHUB_STEP_SUMMARY"

      - name: Verify staged files
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release/verify.sh --staged bin

      # Published releases are immutable, so the release is built and verified as a draft and published only once it
      # passes. A rerun finishes the existing draft for the tag instead of failing on it.
      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none)
              # Every file in bin/ is a release asset, so the verify step can hold the release to exactly this set.
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file notes.md bin/*
              ;;
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber bin/*
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                while IFS= read -r name; do
                  if [ ! -e "bin/$name" ]; then
                    gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
                  fi
                done
              ;;
            *)
              echo "release $TAG is already published, and published releases cannot change" >&2
              exit 1
              ;;
          esac

      - name: Verify draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: build/release/verify.sh "$TAG" bin

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # What a stranger's Mortar fetches: warns while the repo is private, fails once it is public.
      - name: Check public reachability
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: build/release/verify.sh --public "$TAG"

      # The site's download links follow the latest release, so a renamed asset breaks them the moment it publishes.
      - name: Site download links
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/site-downloads.ts

  # Publishes the signed package repository to the `packages` branch, served at https://mortar.rethunk.tech/packages.
  package-repo:
    needs: finalize
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/package-repo.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      MORTAR_REPO_GPG_KEY: ${{ secrets.MORTAR_REPO_GPG_KEY }}
