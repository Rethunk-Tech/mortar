name: Release

# A v* tag builds, signs and publishes the release; a manual dispatch runs the amd64 (+ Windows) build and
# signing as a dry run and publishes nothing. Linux arm64 is a second matrix leg on tags only
# (ubuntu-24.04-arm). The signed manifest is assembled after both tag legs so it can name both AppImages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          amd64='{"runner":"ubuntu-latest","goarch":"amd64","appimage_arch":"x86_64","deb_arch":"amd64","rpm_arch":"x86_64","pkg_arch":"x86_64","windows":true,"flatpak":true}'
          arm64='{"runner":"ubuntu-24.04-arm","goarch":"arm64","appimage_arch":"aarch64","deb_arch":"arm64","rpm_arch":"aarch64","pkg_arch":"aarch64","windows":false,"flatpak":false}'
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "matrix={\"include\":[$amd64,$arm64]}" >>"$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$amd64]}" >>"$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NFPM_ARCH: ${{ matrix.deb_arch }}
      APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version agreement
        run: |
          set -euo pipefail
          go_ver="$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)"
          cfg_ver="$(sed -n 's/^  version: "\(.*\)".*/\1/p' build/config.yml)"
          man_ver="$(sed -n 's/.*name="tech.rethunk.mortar" version="\([^"]*\)".*/\1/p' build/windows/wails.exe.manifest)"
          if [ -z "$go_ver" ] || [ "$go_ver" != "$cfg_ver" ] || [ "$go_ver" != "$man_ver" ]; then
            echo "version mismatch: main.go=$go_ver config.yml=$cfg_ver manifest=$man_ver" >&2
            exit 1
          fi

      - name: GTK4 and WebKitGTK 6.0
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: NSIS
        if: matrix.windows
        run: sudo apt-get install -y --no-install-recommends nsis

      - name: Setup Go
        uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          go-version-file: go.mod

      # go.mod replaces wailsapp/wails/v3 with the Rethunk-AI fork, and `go install module@version` ignores
      # replace directives, so the CLI is built inside the fork's own module at the exact version go.mod pins.
      - name: Go tools
        run: |
          go mod download github.com/wailsapp/wails/v3
          wails_dir="$(go list -m -f '{{.Replace.Dir}}' github.com/wailsapp/wails/v3)"
          (cd "$wails_dir" && go build -o "$(go env GOPATH)/bin/wails3" ./cmd/wails3)
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Setup Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # main.go embeds frontend/dist, so Go's typecheck in the gate needs it built.
      - name: Frontend build
        run: bun run bindings && bun run --cwd frontend build

      - name: Offline gate
        run: bun run gate

      - name: Linux AppImage
        run: wails3 task linux:create:appimage

      - name: Linux deb, rpm and Arch packages
        run: sudo apt-get install -y --no-install-recommends rpm && wails3 task linux:nfpm

      - name: Linux Flatpak
        if: matrix.flatpak
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          wails3 task linux:flatpak

      - name: Windows exe and installer
        if: matrix.windows
        run: |
          wails3 task windows:package INSTALL_SCOPE=user
          cp bin/mortar.exe bin/mortar-windows-amd64.exe

      - name: Signed manifest
        if: matrix.windows && github.ref_type != 'tag'
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)"
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          MORTAR_UPDATE_KEY="$key" wails3 task release:manifest VERSION="$version"

      - name: Stage artifacts
        if: github.ref_type == 'tag'
        run: |
          mkdir -p out
          cp "bin/mortar-linux-${{ matrix.appimage_arch }}.AppImage" out/
          cp "bin/mortar-linux-${{ matrix.goarch }}" out/
          cp bin/mortar_*_${{ matrix.deb_arch }}.deb out/
          cp bin/mortar-*-${{ matrix.rpm_arch }}.rpm out/
          cp bin/mortar-*-${{ matrix.pkg_arch }}.pkg.tar.zst out/
          if [ "${{ matrix.flatpak }}" = true ]; then
            cp bin/mortar-linux-x86_64.flatpak out/
          fi
          if [ "${{ matrix.windows }}" = true ]; then
            cp bin/mortar-windows-amd64.exe bin/mortar-amd64-installer.exe out/
          fi

      - name: Upload artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mortar-linux-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error

  finalize:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          go-version-file: go.mod

      - name: wails3 CLI
        run: |
          go mod download github.com/wailsapp/wails/v3
          wails_dir="$(go list -m -f '{{.Replace.Dir}}' github.com/wailsapp/wails/v3)"
          (cd "$wails_dir" && go build -o "$(go env GOPATH)/bin/wails3" ./cmd/wails3)

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bin
          merge-multiple: true

      - name: Signed manifest
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)"
          fi
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          MORTAR_UPDATE_KEY="$key" wails3 task release:manifest VERSION="$version"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mortar
          path: |
            bin/mortar-linux-x86_64.AppImage
            bin/mortar-linux-amd64
            bin/mortar_*_amd64.deb
            bin/mortar-*-1.x86_64.rpm
            bin/mortar-*-1-x86_64.pkg.tar.zst
            bin/mortar-linux-x86_64.flatpak
            bin/mortar-linux-aarch64.AppImage
            bin/mortar-linux-arm64
            bin/mortar_*_arm64.deb
            bin/mortar-*-1.aarch64.rpm
            bin/mortar-*-1-aarch64.pkg.tar.zst
            bin/mortar-windows-amd64.exe
            bin/mortar-amd64-installer.exe
            bin/manifest.json
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            bin/mortar-linux-x86_64.AppImage \
            bin/mortar-linux-amd64 \
            "bin/mortar_${version}_amd64.deb" \
            "bin/mortar-${version}-1.x86_64.rpm" \
            "bin/mortar-${version}-1-x86_64.pkg.tar.zst" \
            bin/mortar-linux-x86_64.flatpak \
            bin/mortar-linux-aarch64.AppImage \
            bin/mortar-linux-arm64 \
            "bin/mortar_${version}_arm64.deb" \
            "bin/mortar-${version}-1.aarch64.rpm" \
            "bin/mortar-${version}-1-aarch64.pkg.tar.zst" \
            bin/mortar-windows-amd64.exe \
            bin/mortar-amd64-installer.exe \
            bin/manifest.json
