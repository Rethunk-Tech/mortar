name: Components

on:
  workflow_dispatch:
  repository_dispatch:
    types: [components]

permissions:
  contents: read

concurrency:
  group: components
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          go-version-file: go.mod

      - name: Generate and sign components
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$UPDATE_KEY"
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          GOTMPDIR=/var/tmp TMPDIR=/var/tmp MORTAR_UPDATE_KEY="$key" go run ./cmd/components

      # Published releases are immutable, so each signed manifest is its own components-<serial> release, created once
      # with both files; Mortar reads the newest one.
      - name: Publish components release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          serial="$(jq -r .serial components.json)"
          gh release create "components-$serial" --repo "$REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Components $serial" --notes "Signed component manifest $serial" components.json components.json.sig
