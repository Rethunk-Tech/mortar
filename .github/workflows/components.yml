name: Components

on:
  # A weekly signing keeps the catalog's age under the 14 days after which Mortar says it could not refresh.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [components]

permissions:
  contents: read

concurrency:
  group: components
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: Rethunk-Tech/gh-actions/setup-go@4163d2a5a37b1538dd45926e264b3c4027b5cbaa # v1.24
        with:
          go-version-file: go.mod

      - name: Generate and sign components
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$UPDATE_KEY"
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          GOTMPDIR=/var/tmp TMPDIR=/var/tmp MORTAR_UPDATE_KEY="$key" go run ./cmd/components

      # A catalog the last two released versions cannot read leaves their users on the bundled copy, so it is not
      # published.
      - name: Check the last two releases read it
        env:
          GH_TOKEN: ${{ github.token }}
        run: GOTMPDIR=/var/tmp TMPDIR=/var/tmp scripts/catalog-compat.sh components.json

      # Provenance rides along as components.intoto.jsonl, for verifiers that look for it among a release's assets.
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            components.json
            components.json.sig

      # Published releases are immutable, so each signed manifest is its own components-v2-<serial> release, created
      # once with both files; Mortar reads the newest one. The prefix is the schema's: tagPrefix in internal/components.
      - name: Publish components release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          serial="$(jq -r .serial components.json)"
          cp -- "$BUNDLE" components.intoto.jsonl
          gh release create "components-v2-$serial" --repo "$REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Components v2 $serial" --notes "Signed component manifest $serial" components.json \
            components.json.sig components.intoto.jsonl
