name: Components

on:
  workflow_dispatch:
  repository_dispatch:
    types: [components]

permissions:
  contents: read

concurrency:
  group: components
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          go-version-file: go.mod

      - name: Generate and sign components
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$UPDATE_KEY"
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          GOTMPDIR=/var/tmp TMPDIR=/var/tmp MORTAR_UPDATE_KEY="$key" go run ./cmd/components

      - name: Publish components release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view components --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create components --repo "$REPOSITORY" --title components --notes "Signed component manifest" --latest=false
          fi
          gh release upload components --repo "$REPOSITORY" components.json components.json.sig --clobber
