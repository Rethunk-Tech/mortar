name: CI

# The offline gate on every pull request and every push to main. Packaging stays in release.yml; browser e2e is
# opt-in locally (gate --e2e).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so a gate on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing the gate runs reads Markdown except docs/user-guide.md (problemWhy.test.ts checks its headings), so a docs-only change skips setup and gate unless it touches that file. The filter is a step rather than
      # paths-ignore so the check still reports green for a required status check.
      - name: Code changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          code=true
          site=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename')"
            if [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] && ! printf '%s\n' "$files" | grep -q '^site/'; then
              site=false
            fi
            # The compare API lists at most 300 files; a longer list runs the gate.
            if [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
              && ! printf '%s\n' "$files" | grep -qx 'docs/user-guide.md' \
              && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/)'; then
              code=false
              echo "Only documentation changed; skipping the gate"
            fi
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "site=$site" >>"$GITHUB_OUTPUT"

      - name: Set up Mortar
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-mortar
        with:
          apt-packages: appstream
          lint-tools: "true"

      - name: Offline gate
        if: steps.changes.outputs.code == 'true'
        run: bun run gate

      # The site deploys from main by hand, so a change to its pages is checked against the live release here.
      - name: Site download links
        if: steps.changes.outputs.site == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/site-downloads.ts
