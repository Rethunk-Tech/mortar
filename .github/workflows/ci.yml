name: CI

# The offline gate on every pull request and every push to main. Packaging stays in release.yml; browser e2e is
# opt-in locally (gate --e2e).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so a gate on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Sized for a cold run: a new runner image or lockfile misses every cache, and the post-step saves count against it.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Code changed
        id: changes
        uses: ./.github/actions/code-changed

      - name: Set up Mortar
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-mortar
        with:
          apt-packages: appstream
          lint-tools: "true"

      # The vulnerability database moves without a code change, so every push still checks; loading the Wails cgo
      # packages needs the GTK4 and WebKitGTK headers.
      - name: Set up Go and GTK for the vulnerability check
        if: ${{ !cancelled() && steps.changes.outputs.code != 'true' }}
        uses: ./.github/actions/setup-mortar
        with:
          lint-tools: "true"
          frontend: "false"

      - name: Setup Go
        if: ${{ !cancelled() }}
        uses: Rethunk-Tech/gh-actions/setup-go@346d9d280f6dfd86c9db02310039c90e2a6ddca4 # v1.31
        with:
          go-version-file: go.mod
          run-govulncheck: "true"

      - name: Vulnerability check
        if: ${{ !cancelled() && steps.changes.outputs.code != 'true' }}
        run: scripts/vulncheck.sh

      # Ubuntu's AppArmor refuses unprivileged user namespaces, which the rm-sandbox test needs to prove a mounted-in
      # file survives a sandbox's removal; without this the test skips on the runner.
      - name: Allow unprivileged user namespaces
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Offline gate
        id: gate
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        # Its own budget, well under the job's: the gate prints nothing until its slowest step ends, so a step waiting
        # on something that never answers (govulncheck's database, a module proxy) would otherwise spend the job's
        # whole 35 minutes in silence.
        timeout-minutes: 20
        # The step times show where a runner's few cores go; a fast workstation hides it. A runner out of memory stops
        # the job with SIGTERM and runs no later step, so a kernel OOM kill is printed as it happens.
        run: |
          sudo dmesg --follow --notime | grep --line-buffered -i -E 'out of memory|oom-kill' &
          bun run gate --profile

      # setup-go saves the build cache in a post step only after a passing job, so a gate that fails on a new go.sum
      # leaves every later run on it restoring the same stale fallback and compiling cold again. Same key as setup-go's.
      - name: Go build cache key after a failed gate
        id: go-key
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: |
          suffix=""
          [ "$GITHUB_REF" = refs/heads/main ] && suffix="-$(date -u +%F)"
          v=$(go env GOVERSION)
          echo "key=setup-go-${RUNNER_OS}-${RUNNER_ARCH}-go${v#go}-${SETUP_GO_DEPS_HASH}-${GITHUB_JOB}${suffix}" >>"$GITHUB_OUTPUT"

      - name: Save the Go build cache after a failed gate
        if: ${{ failure() && steps.go-key.outputs.key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SETUP_GO_MOD_CACHE }}
            ${{ env.SETUP_GO_BUILD_CACHE }}
          key: ${{ steps.go-key.outputs.key }}

      # The site deploys from the `packages` branch, which a release or Actions > Package repository publishes, so a change
      # to its pages is checked against the live release here.
      - name: Site download links
        if: ${{ !cancelled() && steps.changes.outputs.site == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/site-downloads.ts

  # The Windows-only tests (*_windows_test.go and the !unix paths) never run on the Linux gate. Only internal/ is
  # tested: main.go embeds the gitignored frontend/dist and only package main imports Wails.
  windows:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Code changed
        id: changes
        uses: ./.github/actions/code-changed

      - name: Cache day
        id: day
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: echo "date=$(date -u +%F)" >>"$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.changes.outputs.code == 'true'
        uses: Rethunk-Tech/gh-actions/setup-go@346d9d280f6dfd86c9db02310039c90e2a6ddca4 # v1.31
        with:
          cache-key-suffix: ${{ github.ref == 'refs/heads/main' && steps.day.outputs.date || '' }}
          go-version-file: go.mod

      # No race detector: the gate races the shared code, and no Windows-only file starts a goroutine or takes a lock.
      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: go test ./internal/...
