name: CI

# The offline gate on every pull request and every push to main. Packaging stays in release.yml; browser e2e is
# opt-in locally (gate --e2e).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so a gate on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Code changed
        id: changes
        uses: ./.github/actions/code-changed

      - name: Set up Mortar
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-mortar
        with:
          apt-packages: appstream
          lint-tools: "true"

      # The vulnerability database moves without a code change, so every push still checks; loading the Wails cgo
      # packages needs the GTK4 and WebKitGTK headers.
      - name: Set up Go and GTK for the vulnerability check
        if: ${{ !cancelled() && steps.changes.outputs.code != 'true' }}
        uses: ./.github/actions/setup-mortar
        with:
          lint-tools: "true"
          frontend: "false"

      - name: Vulnerability check
        if: ${{ !cancelled() && steps.changes.outputs.code != 'true' }}
        run: scripts/vulncheck.sh

      - name: Offline gate
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        # The step times show where a runner's few cores go; a fast workstation hides it.
        run: bun run gate --profile

      # The site deploys from main by hand, so a change to its pages is checked against the live release here.
      - name: Site download links
        if: ${{ !cancelled() && steps.changes.outputs.site == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/site-downloads.ts

  # The Windows-only tests (*_windows_test.go and the !unix paths) never run on the Linux gate. Only internal/ is
  # tested: main.go embeds the gitignored frontend/dist and only package main imports Wails.
  windows:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Code changed
        id: changes
        uses: ./.github/actions/code-changed

      - name: Setup Go
        if: steps.changes.outputs.code == 'true'
        uses: Rethunk-Tech/gh-actions/setup-go@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          go-version-file: go.mod

      # -race needs cgo and gcc; the runner image ships mingw, and the step fails loudly if it does not.
      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          gcc --version
          go test -race ./internal/...
