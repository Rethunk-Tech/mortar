name: Set up Mortar
description: GTK4/WebKitGTK, Go, the wails3 CLI from the fork go.mod pins, Bun and optionally the frontend build and lint or packaging tools.

inputs:
  native:
    description: "false skips the GTK4 and WebKitGTK packages and the Go build cache, for a job that only runs Go tools and never compiles the app."
    default: "true"
  apt-packages:
    description: Extra apt packages to install beside GTK4 and WebKitGTK.
    default: ""
  lint-tools:
    description: "true installs golangci-lint and govulncheck."
    default: "false"
  nfpm:
    description: "true installs nfpm."
    default: "false"
  frontend:
    description: "true installs Bun, the workspace dependencies and builds frontend/dist."
    default: "true"

runs:
  using: composite
  steps:
    # One apt transaction: every package a job needs comes through apt-packages, so a later step never pays for
    # a second dpkg run.
    - name: GTK4 and WebKitGTK 6.0
      if: inputs.native == 'true'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        # APT_PACKAGES holds space-separated package names; word-splitting is intentional.
        # shellcheck disable=SC2086
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev $APT_PACKAGES

    - name: Setup Go
      if: inputs.native == 'true'
      uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
      with:
        go-version-file: go.mod

    # Without the app's compile there is no build cache worth restoring (1.4 GB), so only the module cache is kept.
    - name: Setup Go (no build cache)
      id: setup-go-light
      if: inputs.native != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Go cache paths
      shell: bash
      run: |
        echo "MORTAR_GOBIN=$(go env GOPATH)/bin" >>"$GITHUB_ENV"
        echo "MORTAR_GOMOD=$(go env GOMODCACHE)" >>"$GITHUB_ENV"

    - name: Cache Go modules
      if: inputs.native != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.MORTAR_GOMOD }}
        key: mortar-gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

    # The wails3, nfpm and lint binaries are compiled from source on every run otherwise. The key names everything
    # that decides their content: the dependency graph (the fork pin), this file (tool versions) and the tool set.
    - name: Cache Go tools
      id: tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.MORTAR_GOBIN }}
        key: mortar-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.github/actions/setup-mortar/action.yml') }}-lint-${{ inputs.lint-tools }}-nfpm-${{ inputs.nfpm }}-native-${{ inputs.native }}

    # go.mod replaces wailsapp/wails/v3 with the Rethunk-AI fork, and `go install module@version` ignores
    # replace directives, so the CLI is built inside the fork's own module at the exact version go.mod pins.
    - name: Go tools
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      env:
        LINT_TOOLS: ${{ inputs.lint-tools }}
        NFPM: ${{ inputs.nfpm }}
        NATIVE: ${{ inputs.native }}
      run: |
        set -euo pipefail
        go mod download github.com/wailsapp/wails/v3
        wails_dir="$(go list -m -f '{{.Replace.Dir}}' github.com/wailsapp/wails/v3)"
        # A light job has no GTK4/WebKitGTK headers, and the CLI's tasks need no cgo, so it builds without it there.
        cgo=1; [ "$NATIVE" = true ] || cgo=0
        (cd "$wails_dir" && CGO_ENABLED=$cgo go build -o "$(go env GOPATH)/bin/wails3" ./cmd/wails3)
        if [ "$LINT_TOOLS" = true ]; then
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          # The runner's apt shellcheck lags (0.9.0 on Ubuntu 24.04) and disagrees with current releases, so the gate
          # pins the release developers run.
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$(go env GOPATH)/bin/shellcheck"
        fi
        if [ "$NFPM" = true ]; then
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
        fi

    - name: Setup Bun
      if: inputs.frontend == 'true'
      uses: Rethunk-Tech/gh-actions/setup-bun@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13

    # main.go embeds frontend/dist, so Go's typecheck in the gate needs it built.
    - name: Install dependencies and build the frontend
      if: inputs.frontend == 'true'
      shell: bash
      run: bun install --frozen-lockfile && bun run bindings && bun run --cwd frontend build
