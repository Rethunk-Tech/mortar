name: Set up Mortar
description: GTK4/WebKitGTK, Go, the wails3 CLI from the fork go.mod pins, Bun and optionally the frontend build and lint or packaging tools.

inputs:
  apt-packages:
    description: Extra apt packages to install beside GTK4 and WebKitGTK.
    default: ""
  lint-tools:
    description: "true installs golangci-lint and govulncheck."
    default: "false"
  nfpm:
    description: "true installs nfpm."
    default: "false"
  frontend:
    description: "true installs Bun, the workspace dependencies and builds frontend/dist."
    default: "true"

runs:
  using: composite
  steps:
    - name: GTK4 and WebKitGTK 6.0
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev ${{ inputs.apt-packages }}

    - name: Setup Go
      uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
      with:
        go-version-file: go.mod

    # go.mod replaces wailsapp/wails/v3 with the Rethunk-AI fork, and `go install module@version` ignores
    # replace directives, so the CLI is built inside the fork's own module at the exact version go.mod pins.
    - name: Go tools
      shell: bash
      env:
        LINT_TOOLS: ${{ inputs.lint-tools }}
        NFPM: ${{ inputs.nfpm }}
      run: |
        set -euo pipefail
        go mod download github.com/wailsapp/wails/v3
        wails_dir="$(go list -m -f '{{.Replace.Dir}}' github.com/wailsapp/wails/v3)"
        (cd "$wails_dir" && go build -o "$(go env GOPATH)/bin/wails3" ./cmd/wails3)
        if [ "$LINT_TOOLS" = true ]; then
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
        fi
        if [ "$NFPM" = true ]; then
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
        fi

    - name: Setup Bun
      if: inputs.frontend == 'true'
      uses: Rethunk-Tech/gh-actions/setup-bun@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13

    # main.go embeds frontend/dist, so Go's typecheck in the gate needs it built.
    - name: Install dependencies and build the frontend
      if: inputs.frontend == 'true'
      shell: bash
      run: bun install --frozen-lockfile && bun run bindings && bun run --cwd frontend build
